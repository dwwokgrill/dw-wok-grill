<style>
:root{--bg:#f6f2e8;--surface:#fff;--ink:#1b1712;--muted:#6b6355;--line:#e6dfce;--accent:#f5c518;--accent-ink:#1b1712;--red:#c8281e;--wa:#1faa59;--brand:#111;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110d;--surface:#201b15;--ink:#f4efe3;--muted:#a39a88;--line:#352e24;--red:#ff6a5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14110d;--surface:#201b15;--ink:#f4efe3;--muted:#a39a88;--line:#352e24;--red:#ff6a5e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Source Sans 3",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:40}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font:400 30px/1 Anton,Impact,sans-serif;color:var(--accent);letter-spacing:.5px}.logo small{font:600 13px "Source Sans 3",sans-serif;color:#e8e1cf;letter-spacing:0;margin-left:8px}
.call{color:#111;background:var(--accent);border-radius:20px;padding:7px 14px;font-weight:700;text-decoration:none;font-size:15px}
.hero{position:relative;height:230px;background:#111 center/cover no-repeat;display:flex;align-items:flex-end}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.1) 70%)}
.hero div{position:relative;z-index:1;padding:16px 16px 18px;color:#fff;max-width:720px;margin:0 auto;width:100%}
.hero h1{margin:0 0 4px;font:400 36px/1.05 Anton,Impact,sans-serif;letter-spacing:.5px}
.hero p{margin:0 0 12px;color:#eee}
.hero button{border:0;background:var(--accent);color:var(--accent-ink);font:700 16px "Source Sans 3",sans-serif;padding:11px 20px;border-radius:24px;cursor:pointer}
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:14px;overflow-x:auto;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.cat{flex:none;width:68px;border:0;background:none;color:var(--ink);font:600 13px "Source Sans 3",sans-serif;cursor:pointer;text-align:center;padding:0}
.cat i{display:block;width:60px;height:60px;margin:0 auto 4px;border-radius:50%;background:#222 center/cover;border:3px solid transparent}
.cat.on i{border-color:var(--red)}.cat.on{font-weight:700}
main{max-width:760px;margin:0 auto;padding:6px 14px 110px}
h2{font:400 26px/1.1 Anton,Impact,sans-serif;margin:24px 0 2px;letter-spacing:.4px}
.note{margin:0 0 8px;color:var(--muted);font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr;margin-top:10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.p{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
.p i{flex:none;width:104px;height:104px;border-radius:10px;background:#222 center/cover}
.pb{min-width:0;flex:1;display:flex;flex-direction:column}
.pb b{font-size:17px;line-height:1.2}.pb span{color:var(--muted);font-size:13px;margin-top:2px}
.vs{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.add{display:flex;align-items:center;gap:6px;min-height:40px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:6px 13px;font:700 15px "Source Sans 3",sans-serif;cursor:pointer}
.add small{font-size:12px;font-weight:600;opacity:.8}
.add.has{background:var(--ink);color:var(--bg)}.add.has small{opacity:.8}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:760px;margin:0 auto;padding:14px 18px;border:0;border-radius:12px;background:var(--red);color:#fff;font:700 18px "Source Sans 3",sans-serif;cursor:pointer;text-decoration:none}
.btn.wa{background:var(--wa);justify-content:center;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:700;margin:12px 0 5px}
input[type=text],input[type=tel],textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px 4px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:600 15px "Source Sans 3",sans-serif;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border:0}
.qty{display:flex;align-items:center;gap:10px;flex:none}
.qty button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font:700 20px/1 sans-serif;cursor:pointer}
.total{display:flex;justify-content:space-between;font:400 26px Anton,Impact,sans-serif;margin:12px 0 0}
.err{color:var(--red);font-weight:600;margin:10px 0 0;min-height:1.4em}
.back{border:0;background:none;color:var(--ink);font:700 16px "Source Sans 3",sans-serif;padding:12px 0;cursor:pointer}
.none{color:var(--muted);text-align:center;padding:30px 10px}
.lcard{background:#111;color:#f4efe3;border:2px solid var(--accent);border-radius:16px;padding:18px;margin-bottom:12px}
.lb{font:400 22px Anton,Impact,sans-serif;color:var(--accent)}.lb span{color:#f4efe3;font:600 15px "Source Sans 3",sans-serif}
.lcard label{margin:12px 0 2px}
.lcard input{background:transparent;color:#f4efe3;border:0;border-bottom:1.5px solid var(--accent);border-radius:0;padding:8px 0}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.st{aspect-ratio:1;border-radius:50%;border:2px dashed var(--accent);display:grid;place-items:center;font:400 19px Anton,Impact,sans-serif;color:var(--accent)}
.st.on{background:var(--accent);color:#111;border-style:solid}
.lmsg{margin:0;font-weight:700}
details.card summary{cursor:pointer;font-weight:700}
input[type=password]{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.topr{display:flex;gap:8px}
button.call{border:0;font-family:inherit;cursor:pointer}
</style>

const bg=k=>`style="background-image:url(${IMG[k]})"`;

function menuHTML(){
  let h=`<div class="hero" ${bg("hero")}><div><h1>Hot from the wok</h1><p>Chinese, burgers, shawarma and deals. Order here, we confirm on WhatsApp.</p><button data-cat="Deals">See deals</button></div></div>`;
  h+='<div class="cats">'+[["All","hero"],...MENU.map(c=>[c.name,c.img])].map(([n,k])=>`<button class="cat${S.cat===n?" on":""}" data-cat="${esc(n)}"><i ${bg(k)}></i>${esc(n)}</button>`).join("")+"</div><main>";
  MENU.forEach((c,ci)=>{
    if(S.cat!=="All"&&S.cat!==c.name)return;
    h+=`<section id="s${ci}"><h2>${esc(c.name)}</h2>${c.note?`<p class="note">${esc(c.note)}</p>`:""}<div class="grid">`;
    c.items.forEach((it,ii)=>{
      h+=`<div class="p"><i ${bg(it.i||c.img)}></i><div class="pb"><b>${esc(it.n)}</b>${it.d?`<span>${esc(it.d)}</span>`:""}<div class="vs">`+
      it.v.map((v,vi)=>{const k=`${ci}.${ii}.${vi}`,q=S.cart[k]?S.cart[k].qty:0;
        return `<button class="add${q?" has":""}" data-add="${k}" aria-label="Add ${esc(it.n)} ${esc(v[0])}">${v[0]?`<small>${esc(v[0])}</small>`:""}${q?q+" × ":""}${v[1]}</button>`}).join("")+"</div></div></div>";
    });
    h+="</div></section>";
  });
  return h+"</main>";
}
function checkoutHTML(){
  const rows=Object.entries(S.cart),del=S.type==="Delivery";
  return `<main><button class="back" data-view="menu">← Back to menu</button>
  <div class="card">${rows.map(([k,i])=>`<div class="row"><div><b>${esc(i.name)}</b>${i.label?` <span class="note">${esc(i.label)}</span>`:""}<div class="note">${fmt(i.price)} each</div></div>
  <div class="qty"><button data-dec="${k}" aria-label="Remove one">−</button><b>${i.qty}</b><button data-inc="${k}" aria-label="Add one">+</button></div></div>`).join("")}
  <div class="total"><span>Total</span><span>${fmt(total())}</span></div><p class="note">Delivery charges (if any) will be confirmed on WhatsApp.</p></div>
  <div class="card"><div class="seg">${["Delivery","Pickup"].map(t=>`<button data-type="${t}" class="${S.type===t?"on":""}">${t}</button>`).join("")}</div>
  <label for="name">Your name</label><input type="text" id="name" value="${esc(S.name)}" autocomplete="name">
  <label for="phone">Phone number</label><input type="tel" id="phone" value="${esc(S.phone)}" autocomplete="tel" inputmode="tel">
  ${del?`<label for="addr">Delivery address</label><textarea id="addr" autocomplete="street-address">${esc(S.addr)}</textarea>`:""}
  <label for="notes">Notes (optional)</label><textarea id="notes">${esc(S.notes)}</textarea>
  <p class="err" id="err" role="alert"></p>
  <a class="btn wa" id="send" href="#" target="_blank" rel="noopener">Send order on WhatsApp</a>
  <p class="note" style="margin-top:8px">WhatsApp will open with your order written out. Press send there to finish.</p></div></main>`;
}
function msg(){
  const l=["*New order – D&W Wok & Grill*","","Name: "+S.name.trim(),"Phone: "+S.phone.trim(),"Type: "+S.type];
  if(S.type==="Delivery")l.push("Address: "+S.addr.trim());
  l.push("","*Items*");
  items().forEach(i=>l.push(`${i.qty} × ${i.name}${i.label?" ("+i.label+")":""} = ${fmt(i.qty*i.price)}`));
  l.push("","*Total: "+fmt(total())+"*");
  if(S.notes.trim())l.push("","Notes: "+S.notes.trim());
  return l.join("\n");
}
const LN=8,STAFF_PIN="1234";let LC={name:"",stamps:0};
try{const r=JSON.parse(localStorage.getItem("dw-loyal")||"{}");LC.name=r.name||"";LC.stamps=Math.max(0,Math.min(+r.stamps||0,99))}catch(e){}
const lsave=()=>{try{localStorage.setItem("dw-loyal",JSON.stringify(LC))}catch(x){}};
function loyaltyHTML(){
  const rdy=LC.stamps>=LN,left=LN-LC.stamps;let st="";
  for(let i=0;i<LN;i++)st+=`<div class="st${i<LC.stamps?" on":""}">${i<LC.stamps?"★":(i===LN-1?"FREE":i+1)}</div>`;
  return `<main><button class="back" data-view="menu">← Back to menu</button>
  <div class="lcard"><div class="lb">D&amp;W <span>Wok &amp; Grill · Loyalty card</span></div>
  <label for="ln">Card holder</label><input type="text" id="ln" value="${esc(LC.name)}" placeholder="Your name" autocomplete="name">
  <div class="stamps">${st}</div>
  <p class="lmsg">${rdy?"Reward ready! Show this card to our staff.":left+(left===1?" more stamp":" more stamps")+" to your FREE reward."}</p></div>
  <div class="card"><b>How it works</b><p class="note">You get 1 stamp automatically each time you send an order of Rs. 1,000 or more on WhatsApp. Collect 8 stamps and get a FREE reward. Your card is saved on this phone.</p></div>
  <div class="card"><b>Order not received?</b><p class="note">A stamp is added automatically when you send an order of Rs. 1,000 or more. If we did not receive your order, remove the stamp here.</p>
  <div class="seg"><button data-unstamp="1"${LC.stamps?"":" disabled"}>Remove last stamp</button></div></div>
  ${rdy?`<details class="card"><summary>Staff only</summary><label for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="off"><div class="seg" style="margin-top:10px"><button data-redeem="1">Redeem reward</button></div><p class="err" id="lerr" role="alert"></p></details>`:""}</main>`;
}
function bar(){
  const b=$("#bar");
  if(S.view==="menu"&&count()){b.hidden=false;b.innerHTML=`<button class="btn" data-view="checkout"><span>View order (${count()})</span><span>${fmt(total())}</span></button>`}
  else b.hidden=true;
}
function render(keep){
  const y=window.scrollY,cats=$(".cats"),cx=cats?cats.scrollLeft:0;
  if(S.view==="checkout"&&!count())S.view="menu";
  $("#app").innerHTML=S.view==="menu"?menuHTML():S.view==="loyalty"?loyaltyHTML():checkoutHTML();
  bar();
  if(S.view==="menu"){window.scrollTo(0,keep?y:Math.min(y,0));const c=$(".cats");if(c)c.scrollLeft=cx}
}
document.addEventListener("click",e=>{
  const s=e.target.closest("#send");
  if(s){
    const miss=!S.name.trim()?"Please enter your name.":S.phone.trim().replace(/\D/g,"").length<10?"Please enter a valid phone number.":S.type==="Delivery"&&!S.addr.trim()?"Please enter your delivery address.":"";
    if(miss){e.preventDefault();$("#err").textContent=miss;return}
    s.href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg());
    try{localStorage.setItem("dw-cust",JSON.stringify({name:S.name,phone:S.phone,addr:S.addr}))}catch(x){}
    if(total()>=1000&&LC.stamps<LN&&Date.now()-(LC.last||0)>300000){LC.stamps++;LC.last=Date.now();lsave()}
    return;
  }
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.cat){S.cat=d.cat;render();const t=$(".cats");if(t)window.scrollTo(0,t.offsetTop)}
  else if(d.add){const [ci,ii,vi]=d.add.split(".").map(Number),it=MENU[ci].items[ii],v=it.v[vi];
    S.cart[d.add]=S.cart[d.add]||{name:it.n,label:v[0],price:v[1],qty:0};S.cart[d.add].qty++;render(true)}
  else if(d.inc){S.cart[d.inc].qty++;render(true)}
  else if(d.dec){if(--S.cart[d.dec].qty<=0)delete S.cart[d.dec];render(true)}
  else if(d.type){S.type=d.type;render(true)}
  else if(d.unstamp){LC.stamps=Math.max(0,LC.stamps-1);LC.last=0;lsave();render()}
  else if(d.redeem){const p=$("#pin");if(!p||p.value!==STAFF_PIN){$("#lerr").textContent="Wrong PIN.";return}LC.stamps=Math.max(0,LC.stamps-LN);LC.last=0;lsave();render()}
  else if(d.view){S.view=d.view;render();window.scrollTo(0,0)}
});
document.addEventListener("input",e=>{const k=e.target.id;if(k in {name:1,phone:1,addr:1,notes:1}){S[k]=e.target.value;const r=$("#err");if(r)r.textContent=""}});
document.addEventListener("input",e=>{if(e.target.id==="ln"){LC.name=e.target.value;lsave()}});
render();
</script>
</body>
</html>
